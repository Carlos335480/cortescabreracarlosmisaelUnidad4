services:
  nginx_lb:
    image: nginx:alpine
    container_name: dwi_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/load_balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php_app_1
      - php_app_2
    networks:
      - dwi_network

  php_app_1:
    build: .
    container_name: dwi_app_node1
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dwi_network

  php_app_2:
    build: .
    container_name: dwi_app_node2
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dwi_network

networks:
  dwi_network:
    driver: bridge